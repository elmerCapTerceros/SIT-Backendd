spring:
  application:
    name: sit-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sit_db}
    username: ${DB_USERNAME:sit_user}
    password: ${DB_PASSWORD:sit_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  security:
    jwt-secret: ${JWT_SECRET}
